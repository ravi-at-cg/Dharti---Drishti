version: '3.8'

services:
  app:
    build: .
    container_name: dharti-drishti-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./storage_service:/app/storage_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
